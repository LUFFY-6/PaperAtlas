<html lang="zh-CN">
  <head>
    <script>
      try {
        const theme = localStorage.getItem('paper-atlas-theme')
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark' ? theme : 'system'
      } catch {}
    </script>

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#183d33" />
    <title>Paper Atlas · 论文阅读工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
